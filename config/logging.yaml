version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

# Cau hinh console
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: simple
    filename: logs/application.log

# Cau hinh logger cho tung module
loggers:
  ingestion:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  embedding:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  vector_database:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  llm:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  retrieval:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  chat:
    level: DEBUG
    handlers: [console, file]
    propagate: no

root:
  level: INFO
  handlers: [console]
